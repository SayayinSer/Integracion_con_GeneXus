<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
  <div class="p-6 border-b border-slate-200 bg-slate-50/50 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-slate-800">
        {{ isEdit ? 'Modificar Caja' : 'Nueva Caja' }}
      </h2>
      <p class="text-sm text-slate-500 mt-1">Completa los datos de la caja para GeneXus.</p>
    </div>
    <a routerLink="/cajas" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </a>
  </div>

  <div class="p-6">
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm flex items-start gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="guardar()" #cajaForm="ngForm" class="space-y-6">
      
      <div class="space-y-1">
        <label class="block text-sm font-medium text-slate-700">Caja ID <span class="text-red-500">*</span></label>
        <input type="text" name="CajaId" [(ngModel)]="caja.CajaId" required [disabled]="isEdit"
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all disabled:bg-slate-100 disabled:text-slate-500"
          placeholder="Ej: SUC01">
      </div>

      <div class="space-y-1">
        <label class="block text-sm font-medium text-slate-700">Descripción <span class="text-red-500">*</span></label>
        <input type="text" name="CajaDescripcion" [(ngModel)]="caja.CajaDescripcion" required
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all"
          placeholder="Ej: Caja Principal Centro">
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div class="space-y-1">
          <label class="block text-sm font-medium text-slate-700">Estado <span class="text-red-500">*</span></label>
          <select name="CajaEstado" [(ngModel)]="caja.CajaEstado" required
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all">
            <option value="A">Activa (A)</option>
            <option value="I">Inactiva (I)</option>
          </select>
        </div>

        <div class="space-y-1">
          <label class="block text-sm font-medium text-slate-700">Saldo Inicial <span class="text-red-500">*</span></label>
          <input type="number" name="CajaSaldoInicial" [(ngModel)]="caja.CajaSaldoInicial" required step="0.01"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition-all">
        </div>
      </div>

      <div class="pt-6 mt-6 border-t border-slate-100 flex justify-end gap-3">
        <a routerLink="/cajas" class="px-5 py-2.5 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition-colors">
          Cancelar
        </a>
        <button type="submit" [disabled]="!cajaForm.form.valid || loading"
          class="bg-sky-500 hover:bg-sky-600 text-white px-6 py-2.5 rounded-lg font-medium shadow-sm shadow-sky-500/30 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          
          <svg *ngIf="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          
          {{ loading ? 'Guardando...' : 'Guardar Caja' }}
        </button>
      </div>
    </form>
  </div>
</div>
